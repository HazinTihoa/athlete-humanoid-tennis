# First 200 relabelled episodes (ep_0000 through ep_0199). The source dataset
# is referenced in place and is never modified by the loader.

[robot]
xml = "robots/replay_unitree_description/mjcf/g1.xml"

[registry]
train_prefix = ""

[dataset]
glob = "artifacts/rollout_1000epis_relabelled/ep_0[01][0-9][0-9].npz"
forehand_template = "collected_forehand"
backhand_template = "collected_backhand"
sampling_weight = 1.0
target_pos_std = { x = 0.2, y = 0.3, z = 0.3 }
target_vel_std = { x = 0.0, y = 0.0, z = 0.0 }
target_orientation_std = { roll = 0.0, pitch = 0.0, yaw = 0.0 }
