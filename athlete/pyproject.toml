[project]
name = "athlete"
version = "0.1.0"
description = "ATHLETE: Learning Reactive Humanoid Tennis via Trajectory-Guided Motion Matching"
authors = [
    { name = "Anonymous Authors" }
]
requires-python = ">=3.13"
dependencies = [
    "mjlab>=1.3.0",
    "matplotlib>=3.10",
    "onnxruntime",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
]

[project.scripts]
train        = "athlete.scripts.train:main"
play         = "athlete.scripts.play:main"
play-student-onnx = "athlete.scripts.play_student_onnx:main"
tune-racket-collider = "athlete.scripts.tune_racket_collider:main"
demo         = "athlete.scripts.demo:main"
list-envs    = "athlete.scripts.list_envs:main"
viz-nan      = "athlete.scripts.nan_viz:main"
export-scene = "athlete.scripts.export_scene:main"
play-viser   = "athlete.scripts.play_viser:main"
play-viser-motion-ranges = "athlete.scripts.play_viser_w_motion_ranges:main"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.entry-points."mjlab.tasks"]
athlete = "athlete.goal_cond_tracking.config.g1"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
